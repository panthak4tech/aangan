name: Runtime manifest refresh

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Propose llama.cpp runtime updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install runtime manifest builder dependency
        run: python -m pip install -r tools/runtimes/requirements.txt
      - name: Build candidate manifest
        run: python tools/runtimes/build_runtimes.py
      - name: Open runtime refresh pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: bot/runtimes-refresh
          delete-branch: true
          commit-message: "chore(runtimes): propose llama.cpp update"
          title: "chore(runtimes): propose llama.cpp update"
          body: |
            NOT mergeable until you:
            1. Test this build locally (install + start).
            2. Run `tools/catalog/sign.ps1 -File catalog/runtimes.v1.json`.
            3. Push the generated `catalog/runtimes.v1.json.minisig`.
          add-paths: catalog/runtimes.v1.json
