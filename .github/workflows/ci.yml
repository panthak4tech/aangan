name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DESKTOP_CRATE: aangan-desktop
  RUST_MIN_LINES: "70"
  RUST_CORE_MIN_LINES: "90"
  COV_IGNORE: 'aangan-cli[\\/]src[\\/]main\.rs'

jobs:
  rust:
    name: rust (fmt, clippy, tests, coverage)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Check versions match
        run: node tools/check-version.mjs
      - name: Test version checker
        run: node --test tools/check-version.test.mjs
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude "$DESKTOP_CRATE" --all-targets --locked -- -D warnings
      - name: Doc tests
        run: cargo test --workspace --exclude "$DESKTOP_CRATE" --doc --locked
      - name: Unit tests + coverage (workspace floor)
        run: >
          cargo llvm-cov --workspace --exclude "$DESKTOP_CRATE" --locked
          --lcov --output-path lcov.info
          --ignore-filename-regex "$COV_IGNORE"
          --fail-under-lines "$RUST_MIN_LINES"
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only --ignore-filename-regex "$COV_IGNORE" >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage floor for core crates
        run: cargo llvm-cov -p fitcalc -p aangan-types --locked --fail-under-lines "$RUST_CORE_MIN_LINES"
      - uses: actions/upload-artifact@v7
        with:
          name: rust-lcov
          path: lcov.info
      - name: Build release CLI
        run: cargo build --release -p aangan-cli --locked
      - uses: actions/upload-artifact@v7
        with:
          name: aangan-windows-x64
          path: target/release/aangan.exe

  frontend:
    name: frontend (lint, types, tests, coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run notices:test
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests + coverage (thresholds live in vitest config and fail the job)
        run: npm run test:cov
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/desktop/coverage

  desktop-check:
    name: desktop shell (clippy)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci && npm run build:bundle
        working-directory: apps/desktop
      - run: powershell -NoProfile -File tools/catalog/sign.test.ps1
      - run: powershell -NoProfile -File apps/desktop/src-tauri/tests/cli-path.test.ps1
      - run: powershell -NoProfile -File apps/desktop/src-tauri/tests/release-utils.test.ps1
      - run: cargo clippy -p ${{ env.DESKTOP_CRATE }} --all-targets --locked -- -D warnings

  licenses:
    name: dependencies (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  catalog:
    name: catalog (schema + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install catalog builder dependency
        run: python -m pip install -r tools/catalog/requirements-dev.txt
      - name: Validate committed catalog
        run: python tools/catalog/build_catalog.py --check
      - name: Test catalog builder
        run: python -m pytest tools/catalog/test_build_catalog.py

  ci-required:
    name: ci-required
    if: always()
    needs: [rust, frontend, desktop-check, licenses, catalog]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed"; exit 1
          fi
