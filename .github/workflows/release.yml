name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: Build and draft Windows release
    runs-on: windows-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-about@0.9.2
      - name: Check versions match
        run: node tools/check-version.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          Import-Module ./apps/desktop/scripts/release-utils.psm1
          $desktopVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Assert-ReleaseVersion -Tag $env:GITHUB_REF_NAME -DesktopVersion $desktopVersion
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Check third-party notices
        working-directory: apps/desktop
        run: npm run notices:check
      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run tauri build
      - name: Create checksum
        shell: pwsh
        run: |
          Import-Module ./apps/desktop/scripts/release-utils.psm1
          $version = Get-ReleaseTagVersion -Tag $env:GITHUB_REF_NAME
          $installer = "target/release/bundle/nsis/Aangan_${version}_x64-setup.exe"
          $checksumFile = "target/release/bundle/nsis/SHA256SUMS.txt"
          $null = Write-ReleaseChecksum -InstallerPath $installer -ChecksumPath $checksumFile
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/bundle/nsis/Aangan_*_x64-setup.exe
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Import-Module ./apps/desktop/scripts/release-utils.psm1
          $version = Get-ReleaseTagVersion -Tag $env:GITHUB_REF_NAME
          $installer = "target/release/bundle/nsis/Aangan_${version}_x64-setup.exe"
          $checksums = "target/release/bundle/nsis/SHA256SUMS.txt"
          gh release create $env:GITHUB_REF_NAME $installer $checksums `
            --draft --verify-tag --generate-notes --title "Aangan $env:GITHUB_REF_NAME"
