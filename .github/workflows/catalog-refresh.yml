name: Catalog refresh

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Propose catalog metadata updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install catalog builder dependency
        run: python -m pip install -r tools/catalog/requirements.txt
      - name: Build catalog
        run: python tools/catalog/build_catalog.py --summary-file "$RUNNER_TEMP/catalog-refresh-body.md"
      - name: Open catalog refresh pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: bot/catalog-refresh
          delete-branch: true
          commit-message: "chore(catalog): refresh model catalog"
          title: "chore(catalog): refresh model catalog"
          body-path: ${{ runner.temp }}/catalog-refresh-body.md
          add-paths: catalog/models.v1.json
