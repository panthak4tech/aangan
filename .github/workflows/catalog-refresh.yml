name: Catalog refresh

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Propose catalog metadata updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install catalog builder dependency
        run: python -m pip install -r tools/catalog/requirements.txt
      - name: Build catalog
        run: python tools/catalog/build_catalog.py --summary-file "$RUNNER_TEMP/catalog-refresh-body.md"
      - name: Open catalog refresh pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: bot/catalog-refresh
          delete-branch: true
          commit-message: "chore(catalog): refresh model catalog"
          title: "chore(catalog): refresh model catalog"
          body-path: ${{ runner.temp }}/catalog-refresh-body.md
          add-paths: catalog/models.v1.json
